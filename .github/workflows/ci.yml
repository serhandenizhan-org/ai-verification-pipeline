# FAST CI — deterministik ilk savunma hattı.
# Codex gibi pahalı/probabilistic adımlardan ÖNCE çalışır.
# Not: lint/typecheck/unit/build adımları proje stack'ine göre uyarlanmalıdır
# (bu dosya Node.js varsayımıyla örneklenmiştir — Python projede ilgili
# adımları değiştirin).

name: Fast CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks tara
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"

  lint-typecheck-unit-build:
    name: Lint / Typecheck / Unit / Build
    runs-on: [self-hosted, macOS, ARM64]
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Bilinen güvenlik açıklarını tara
        run: npm audit --audit-level=high

      - name: AC lock bütünlüğünü doğrula
        run: bash scripts/verify_ac_lock.sh

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit + integration testler
        run: npm test -- --ci

      - name: Build
        run: npm run build

  e2e-playwright:
    name: Playwright E2E
    runs-on: [self-hosted, macOS, ARM64]
    needs: lint-typecheck-unit-build
    env:
      # Guard: STRIPE_SECRET_KEY yanlışlıkla sk_live_ ile başlarsa pipeline durur.
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Stripe key modunu doğrula (test mode zorunlu)
        run: bash scripts/check_stripe_key_mode.sh

      - name: Playwright tarayıcılarını kur
        run: npx playwright install --with-deps

      - name: E2E testleri çalıştır
        run: npx playwright test

      - name: Test raporunu artifact olarak yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

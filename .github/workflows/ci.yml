# FAST CI — deterministik ilk savunma hattı.
# Codex gibi pahalı/probabilistic adımlardan ÖNCE çalışır.
# Not: lint/typecheck/unit/build adımları proje stack'ine göre uyarlanmalıdır
# (bu dosya Node.js varsayımıyla örneklenmiştir — Python projede ilgili
# adımları değiştirin).
#
# SANDBOX NOTU: Runner self-hosted VE macOS (Mac mini) olduğu için GitHub
# Actions'ın native `container:` job anahtarı KULLANILAMAZ — bu özellik
# resmi olarak yalnızca Linux runner'larda destekleniyor. Bunun yerine,
# untrusted PR kodunu çalıştıran adımlar doğrudan `docker run` ile bir
# container içinde izole ediliyor (workspace bind-mount edilir, container
# iş bitince --rm ile silinir). Host'a doğrudan npm/node kurulmuyor.

name: Fast CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks tara
        # gitleaks/gitleaks-action@v2 artık lisans istiyor (ücretli) —
        # ücretsiz CLI'ı (self-hosted runner'da zaten kurulu) doğrudan
        # çağırıyoruz, wrapper action'a gerek yok.
        run: |
          gitleaks detect --source=. --redact --verbose --log-opts="origin/main..HEAD"

  lint-typecheck-unit-build:
    name: Lint / Typecheck / Unit / Build
    runs-on: [self-hosted, macOS, ARM64]
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4

      - name: Bağımlılık kur + lint + typecheck + test + build (container içinde, izole)
        run: |
          docker run --rm \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            --network=bridge \
            -v "$PWD":/workspace -w /workspace \
            node:20-bookworm-slim \
            bash -c "
              set -euo pipefail
              npm ci
              npm audit --audit-level=high
              bash scripts/verify_ac_lock.sh
              npm run lint
              npm run typecheck
              npm test -- --ci
              npm run build
            "

  e2e-playwright:
    name: Playwright E2E
    runs-on: [self-hosted, macOS, ARM64]
    needs: lint-typecheck-unit-build
    env:
      # Guard: STRIPE_SECRET_KEY yanlışlıkla sk_live_ ile başlarsa pipeline durur.
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Bağımlılık kur + Stripe key kontrolü + E2E testleri (container içinde, izole)
        run: |
          # mcr.microsoft.com/playwright imajı Node + tarayıcıları hazır getiriyor,
          # ayrıca --ipc=host chromium'un shared-memory crash'ini önlüyor
          # (bu adımda cap-drop kullanmıyoruz, chromium sandbox'ı ile çakışıyor).
          docker run --rm \
            --ipc=host \
            -e STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY" \
            -v "$PWD":/workspace -w /workspace \
            mcr.microsoft.com/playwright:v1.48.0-jammy \
            bash -c "
              set -euo pipefail
              npm ci
              bash scripts/check_stripe_key_mode.sh
              npx playwright test
            "

      - name: Test raporunu artifact olarak yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

# VERIFICATION — Fast CI PASS olduktan SONRA çalışır.
# Risk seviyesini hesaplar, seviyeye göre Reviewer Codex'i tetikler,
# sonuçları Verification Ledger'a yazar, gerekirse Şef'e bildirim gönderir
# ve EN SONUNDA tek bir bağlayıcı "verification-gate" commit status'u
# üretir (bkz. Codex review bulgusu — P1: "hiçbir sonuç merge'ü gerçekten
# engellemiyordu"). GitHub branch protection'da ZORUNLU status check
# olarak yalnızca "verification-gate" belirtilmelidir — Fast CI'ın kendi
# job'larının hepsi buna zaten dolaylı olarak dahildir (risk hesaplanmamışsa
# gate FAIL verir, bkz. verifier.py cmd_gate).
#
# Codex entegrasyonu: `codex` CLI (Codex CLI, ChatGPT hesabıyla login,
# bkz. HANDOFF.md 4.8) self-hosted runner'da zaten authenticated. Kör
# (blind) review ilkesi gereği bu job Orchestrator'ın adversarial
# bulgularını GÖRMEDEN çalışır — böyle bir not bu repoda zaten üretilmiyor,
# yalnızca severity_rules.md'deki formatı referans alıyor.

name: Verification

on:
  workflow_run:
    workflows: ["Fast CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  risk-routing:
    name: Risk Routing
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, macOS, ARM64]
    outputs:
      risk_level: ${{ steps.risk.outputs.risk_level }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # head_branch YETERSİZ: fork PR'larda bu branch base repo'da
          # bulunmuyor, checkout sessizce/açıkça fail eder (Codex review
          # bulgusu). head_sha immutable ve her durumda çözülebilir.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Güvenilir orchestrator kodunu PR checkout'unun DIŞINA stage'le
        # Codex review bulgusu (P1): dosyaları PR checkout'u İÇİNDE
        # ezmek (eski pin_trusted_files.sh davranışı) yeterli değildi —
        # Python, çalıştırılan script'in kendi dizinini sys.path'in başına
        # koyar, yani PR yeni bir sibling modül ekleyerek (ör.
        # orchestrator/argparse.py) ezilmiş dosyaların import'larını bile
        # gölgeleyebilirdi (GERÇEK bir saldırıyla test edilip doğrulandı).
        # Artık güvenilir kod PR ağacının TAMAMEN DIŞINDA ($RUNNER_TEMP)
        # çalışıyor. Script'in KENDİSİ de PR'dan değil origin/main'den
        # çekiliyor (yoksa PR onu no-op'a çevirebilir).
        id: stage
        run: |
          TRUSTED_DIR=$(git show origin/main:scripts/stage_trusted_orchestrator.sh | bash -s -- "$RUNNER_TEMP/trusted-orchestrator")
          echo "dir=$TRUSTED_DIR" >> "$GITHUB_OUTPUT"

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Orchestrator bağımlılıklarını kur (psycopg — Postgres ledger için)
        run: pip install -r "${{ steps.stage.outputs.dir }}/orchestrator/requirements.txt"

      - name: Risk seviyesini hesapla + ledger'a yaz
        id: risk
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 "${{ steps.stage.outputs.dir }}/orchestrator/router.py" --base origin/main --head HEAD
          python3 "${{ steps.stage.outputs.dir }}/orchestrator/verifier.py" compute-risk \
            --pr "$PR_NUMBER" \
            --base origin/main \
            --head HEAD \
            --head-sha "$HEAD_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            | tee risk.json
          echo "risk_level=$(python3 -c 'import json; print(json.load(open("risk.json"))["risk_level"])')" >> "$GITHUB_OUTPUT"

  codex-review:
    name: Reviewer Codex (deep review)
    needs: risk-routing
    if: needs.risk-routing.outputs.risk_level != 'LOW'
    runs-on: [self-hosted, macOS, ARM64]
    env:
      # notifier.py bunları okuyor — BLOCKING bulgu/circuit breaker/ready-
      # for-review bildirimleri bu ikisi olmadan sessizce (yalnızca stderr
      # uyarısıyla) atlanır, pipeline'ı bloklamaz ama Şef habersiz kalır.
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Codex'in okuyacağı davranış dosyalarını main'den sabitle
        # AGENTS.md / severity_rules.md — Codex bunları authenticated
        # olarak OKUYOR (çalıştırmıyor), risk prompt injection. In-place
        # ezme burada yeterli (çalıştırılan Python kodu için değil).
        run: git show origin/main:scripts/pin_trusted_files.sh | bash

      - name: Güvenilir orchestrator kodunu PR checkout'unun DIŞINA stage'le
        id: stage
        run: |
          TRUSTED_DIR=$(git show origin/main:scripts/stage_trusted_orchestrator.sh | bash -s -- "$RUNNER_TEMP/trusted-orchestrator")
          echo "dir=$TRUSTED_DIR" >> "$GITHUB_OUTPUT"

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Orchestrator bağımlılıklarını kur (psycopg — Postgres ledger için)
        run: pip install -r "${{ steps.stage.outputs.dir }}/orchestrator/requirements.txt"

      - name: Yeni bağımlılıkları tespit et (tedarik zinciri metadata'sı)
        id: deps
        run: |
          python3 "${{ steps.stage.outputs.dir }}/scripts/check_new_dependencies.py" --base origin/main --head HEAD > new_deps_report.json
          echo "found=$(python3 -c 'import json; print(json.load(open("new_deps_report.json"))["new_dependencies_found"])')" >> "$GITHUB_OUTPUT"

      - name: needs-codex-review etiketini ekle
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr edit "$PR_NUMBER" --add-label "needs-codex-review"

      - name: "@codex review yorumu at (ChatGPT/Codex mobil app'te PR takibi için)"
        # Doğrulandı: bu yorumu atmak, PR'ın hesap seviyesinde bağlı
        # ChatGPT/Codex Desktop + mobil app'in "Pull request'ler" sekmesinde
        # görünmesini sağlıyor. Asıl gating kararımızı vermiyor — onu
        # aşağıdaki CLI review + verification-gate job'ı yapıyor.
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment "$PR_NUMBER" --body "@codex review"

      - name: Codex review çalıştır (kör — Orchestrator'ın adversarial notlarını görmez)
        id: codex
        run: |
          set +e
          codex exec review \
            --base origin/main \
            --skip-git-repo-check \
            -o codex_last_message.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Bulgu sayılarını çıkar
        # codex exec review kendi P1/P2/P3 öncelik şablonunu kullanıyor.
        # P1 -> BLOCKING, P2/P3 -> ADVISORY eşlemesi kullanılıyor.
        #
        # KRİTİK NOT (Codex review bulgusu — P1): GitHub Actions'ın
        # varsayılan shell'i `bash -e`dir. `X=$(grep -c ... 2>/dev/null)`
        # grep eşleşme bulamayınca (exit 1) satırın KENDİSİ script'i
        # ANINDA sonlandırıyordu — `${X:-0}` satırına HİÇ ulaşılmıyordu.
        # Bu, 0 bulgulu ya da tek kategorili (yalnız ADVISORY) her temiz
        # raporda adımı sessizce kesiyordu. `|| true` ile grep'in kendi
        # exit kodunu her zaman 0'a sabitliyoruz, `${VAR:-0}` da boş/eksik
        # durumu 0'a çeviriyor (çift-sıfır bug'ından farklı — bkz. eski not).
        id: findings
        run: |
          BLOCKING=$(grep -c '^- \[P1\]' codex_last_message.txt 2>/dev/null || true); BLOCKING=${BLOCKING:-0}
          ADVISORY=$(grep -cE '^- \[(P2|P3)\]' codex_last_message.txt 2>/dev/null || true); ADVISORY=${ADVISORY:-0}
          echo "blocking=$BLOCKING" >> "$GITHUB_OUTPUT"
          echo "advisory=$ADVISORY" >> "$GITHUB_OUTPUT"

      - name: Sonucu ledger'a yaz (rapor metni + deps raporu dahil)
        # Codex'in önerdiği özellik: TEK güncellenen PR yorumu. Rapor
        # metnini ve tedarik zinciri raporunu ARTIK BURADA PR'a yorum
        # olarak atmıyoruz — ikisini de ledger'a yazıyoruz, PR yorumunu
        # (tek, düzenlenen) verification-gate job'u kompoze edip yazıyor
        # (o job risk+codex+trufflehog'un HEPSİNİ görüyor, burası yalnızca
        # Codex kısmını).
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          PR_URL: ${{ github.event.workflow_run.pull_requests[0].html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          CODEX_STATUS="PASS"
          if [[ "${{ steps.codex.outputs.exit_code }}" != "0" ]]; then
            CODEX_STATUS="FAIL"
          fi
          python3 "${{ steps.stage.outputs.dir }}/orchestrator/verifier.py" record-codex \
            --pr "$PR_NUMBER" \
            --status "$CODEX_STATUS" \
            --findings-json "{\"blocking\": ${{ steps.findings.outputs.blocking }}, \"advisory\": ${{ steps.findings.outputs.advisory }}}" \
            --report-url "$PR_URL" \
            --pr-url "$PR_URL" \
            --head-sha "$HEAD_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --report-file codex_last_message.txt \
            --deps-report-file new_deps_report.json \
            --failure-text "codex exec review exit_code=${{ steps.codex.outputs.exit_code }}" || true
          # NOT: record-codex artık BLOCKING varsa 1 dönüyor (defense in
          # depth) — ama bu adımın kendisi FAIL olursa sonraki job'lar
          # (verification-gate dahil) yine de çalışmalı, o yüzden `|| true`.
          # Asıl karar merci ledger + verification-gate'tir, bu adımın
          # exit code'u değil.
      - name: Kullanım sayacını artır ve eşikleri kontrol et (maliyet görünürlüğü)
        # Codex'in önerdiği özellik: her `codex exec review` çağrısı bu
        # pipeline'ın asıl maliyet sürücüsüdür. Postgres'te günlük sayaç
        # tutuluyor, WARN/CRITICAL eşiği aşılırsa Telegram'a bildirim
        # gidiyor — ama pipeline KENDİ KENDİNE DURMUYOR (claude.md politikası).
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Repo Variables (Settings → Secrets and variables → Actions →
          # Variables) ile özelleştirilebilir; tanımlı değilse script'in
          # kendi varsayılanlarına (10/20) düşer.
          CODEX_DAILY_WARN_THRESHOLD: ${{ vars.CODEX_DAILY_WARN_THRESHOLD }}
          CODEX_DAILY_CRITICAL_THRESHOLD: ${{ vars.CODEX_DAILY_CRITICAL_THRESHOLD }}
        run: |
          python3 "${{ steps.stage.outputs.dir }}/orchestrator/usage_tracker.py" record \
            --repo "$GITHUB_REPOSITORY" --event-type codex_review || true

  low-risk-fast-path:
    name: Low Risk — Doğrudan Şef Onayına Geç
    # Codex'in önerdiği özellik (tek PR yorumu) sonrası: bu job'un
    # PR yorumu/etiket ekleme sorumluluğu verification-gate'e taşındı —
    # o job risk seviyesinden bağımsız HER ZAMAN çalışıyor ve gate'in
    # gerçek kararına göre tek, tutarlı bir yorum/etiket seti üretiyor.
    # Bu job artık yalnızca needs graph'ında bir placeholder.
    needs: risk-routing
    if: needs.risk-routing.outputs.risk_level == 'LOW'
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - run: echo "Risk LOW — Codex review atlandı, karar verification-gate'te veriliyor."

  verification-gate:
    name: Verification Gate
    # Codex review bulgusu (P1): önceden hiçbir job TÜM sonuçları TEK bir
    # bağlayıcı karara dönüştürmüyordu — Fast CI, risk-routing, codex-review
    # ayrı ayrı çalışıp PR'a yorum/etiket bırakıyordu ama GitHub'ın
    # required status check listesinde yalnızca "Secret Scan (gitleaks)"
    # vardı. Yani Codex BLOCKING dese bile merge butonu aktif kalıyordu.
    #
    # Bu job HER ZAMAN çalışır (if: always()) — önceki job'lardan biri
    # skip/fail olsa bile gate bir karar üretip commit status'unu yazmalı
    # (aksi halde required check hiç oluşmaz, PR sonsuza kadar "pending"
    # kalır — bu da fail-closed'dır ama nedeni belirsiz olur, bu yüzden
    # açıkça FAIL yazıp nedeni belirtmek daha iyi).
    needs: [risk-routing, codex-review, low-risk-fast-path]
    if: always()
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Güvenilir orchestrator kodunu stage'le
        id: stage
        run: |
          TRUSTED_DIR=$(git show origin/main:scripts/stage_trusted_orchestrator.sh | bash -s -- "$RUNNER_TEMP/trusted-orchestrator")
          echo "dir=$TRUSTED_DIR" >> "$GITHUB_OUTPUT"

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Orchestrator bağımlılıklarını kur
        run: pip install -r "${{ steps.stage.outputs.dir }}/orchestrator/requirements.txt"

      - name: Bekleyen Telegram komutlarını işle (durdur/devam/kabul)
        # Codex'in önerdiği özellik 7: kalıcı bir daemon yerine, gate her
        # çalıştığında (her PR event'inde) bekleyen komutlar bir kez
        # kontrol edilir — bkz. orchestrator/telegram_commands.py docstring'i.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 "${{ steps.stage.outputs.dir }}/orchestrator/telegram_commands.py" poll-once || true

      - name: Bağlayıcı kararı üret ve GitHub commit status olarak yaz
        id: gate
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          PR_URL: ${{ github.event.workflow_run.pull_requests[0].html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          GATE_OUTPUT=$(python3 "${{ steps.stage.outputs.dir }}/orchestrator/verifier.py" gate \
            --pr "$PR_NUMBER" \
            --head-sha "$HEAD_SHA")
          GATE_EXIT=$?
          set -e

          echo "Gate çıktısı: $GATE_OUTPUT"
          DECISION=$(python3 -c "import json,sys; print(json.loads(sys.argv[1])['decision'])" "$GATE_OUTPUT" 2>/dev/null || echo "FAIL")
          REASON=$(python3 -c "import json,sys; print(json.loads(sys.argv[1])['reason'])" "$GATE_OUTPUT" 2>/dev/null || echo "gate script çalışırken hata oluştu (exit=$GATE_EXIT) — fail-closed")

          if [[ "$DECISION" == "PASS" ]]; then
            STATE="success"
          else
            STATE="failure"
          fi

          # ÖNEMLİ (Codex review bulgusu): workflow_run olayının kendi
          # varsayılan SHA'sı base branch'e aittir — status'u AÇIKÇA
          # PR'ın gerçek head_sha'sına yazmak gerekir, yoksa GitHub bunu
          # PR'ın "Checks" sekmesiyle hiç ilişkilendirmez.
          gh api "repos/${{ github.repository }}/statuses/$HEAD_SHA" \
            -f state="$STATE" \
            -f context="verification-gate" \
            -f description="$REASON" \
            -f target_url="$PR_URL"

          echo "Karar: $DECISION — $REASON"
          echo "gate_decision=$DECISION" >> "$GITHUB_OUTPUT"
          [[ "$DECISION" == "PASS" ]]

      - name: Tek, güncellenen PR yorumunu oluştur/güncelle (Codex'in önerdiği özellik)
        # Önceden Codex raporu + tedarik zinciri raporu + LOW-risk mesajı
        # AYRI yorumlar olarak birikip PR'ı kalabalıklaştırıyordu. Artık
        # tek bir "işaretli" (MARKER ile başlayan) yorum var — her run'da
        # YENİ yorum eklenmiyor, var olan GÜNCELLENİYOR.
        if: always()
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 "${{ steps.stage.outputs.dir }}/orchestrator/verifier.py" render-comment \
            --pr "$PR_NUMBER" --head-sha "$HEAD_SHA" > comment_body.md || true

          MARKER='<!-- ai-verification-pipeline:status -->'
          EXISTING_ID=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)

          if [[ -n "$EXISTING_ID" ]]; then
            gh api "repos/${{ github.repository }}/issues/comments/$EXISTING_ID" \
              --method PATCH -f body="$(cat comment_body.md)"
            echo "Var olan durum yorumu güncellendi (id=$EXISTING_ID)."
          else
            gh pr comment "$PR_NUMBER" --body-file comment_body.md
            echo "Yeni durum yorumu oluşturuldu."
          fi

      - name: PR etiketlerini uzlaştır (Codex review bulgusu — P2)
        # "needs-codex-review" incelemeden sonra da takılı kalıyordu,
        # "ready-for-human-approval" yalnızca LOW risk yolunda ekleniyor,
        # HIGH/CRITICAL risk PASS olduğunda hiç eklenmiyordu. Artık PR'ın
        # etiketleri her zaman gate'in son kararını yansıtıyor.
        if: always()
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "needs-codex-review" 2>/dev/null || true
          if [[ "${{ steps.gate.outputs.gate_decision }}" == "PASS" ]]; then
            gh pr edit "$PR_NUMBER" --add-label "ready-for-human-approval" 2>/dev/null || true
          else
            gh pr edit "$PR_NUMBER" --remove-label "ready-for-human-approval" 2>/dev/null || true
          fi
